name: CI/CD Chat App

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend Image
        run: docker build -t skmdakbar3/tchat-backend ./backend

      - name: Build Frontend Image
        run: docker build -t skmdakbar3/tchat-frontend ./frontend

      - name: Push Backend
        run: docker push skmdakbar3/tchat-backend

      - name: Push Frontend
        run: docker push skmdakbar3/tchat-frontend